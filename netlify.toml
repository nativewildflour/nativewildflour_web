[build]
  # `verify` is the acceptance gate (docs/BRIEF.md §5) — running it here is what makes
  # the content rules enforced rather than merely documented. A failing check fails the deploy.
  command = "npm run build && npm run verify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Root-level icons and the manifest sit outside /images/, so mirror its cache policy.
[[headers]]
  for = "/icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/apple-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# NOTE: Netlify header patterns support only trailing "/*" splats — an extension glob
# like "/*.txt" matches nothing. The RSC .txt prefetch payloads are kept out of search
# results via the Disallow rule in src/app/robots.ts instead.
